# 可选件：用仓库自带的 Caddy 反向代理，自动申请并续期 Let's Encrypt 证书。
#
# 已经自建了反代（nginx / Traefik / 别的 Caddy）就【不要】用这个文件。
#
# 用法（和主文件叠加）：
#   docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d --build
#
# 前置条件：
#   1. .env 里填 DOMAIN（建议连 ACME_EMAIL 一起填）
#   2. 域名 A 记录已指向本机公网 IP
#   3. 本机 80 / 443 没被别的服务占用（已有反代的话必然冲突）
#   4. 别再用 IP 直连了 → .env 里设 BIND_ADDR=127.0.0.1

services:
  caddy:
    image: caddy:2-alpine
    container_name: life-workbench-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?用了 Caddy 就要在 .env 里设置 DOMAIN，例如 life.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
