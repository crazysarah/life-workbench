name: life-workbench

# 只需要这一个文件就能跑起来：docker compose up -d --build
#
# 反代（nginx / Caddy / Traefik 等）请用你自己已有的，参考 .env 里的 BIND_ADDR 说明。
# 仓库自带的 Caddy 是可选件，放在 deploy/docker-compose.caddy.yml，不需要就别管它。

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: life-workbench-api:latest
    container_name: life-workbench-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_FILE: /data/workbench.db
      CLIENT_DIR: /app/client
      APP_PASSWORD: ${APP_PASSWORD:?请先在 .env 里设置 APP_PASSWORD}
      APP_SECRET: ${APP_SECRET:-lw-default-secret-change-me}
    ports:
      # 三种情况按需选一：
      #   1) 直接 IP 访问              → 保持默认，BIND_ADDR 不用设（等于 0.0.0.0）
      #   2) 本机已有反代（nginx…）     → .env 里设 BIND_ADDR=127.0.0.1，只对本机开放
      #   3) 反代跑在同一个 docker 网络 → 把下面这行整个删掉，
      #                                  反代上游填 http://life-workbench-api:8080
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      # 数据存哪，由 .env 的 DATA_VOLUME 决定：
      #   留空（默认）→ docker 卷 lw-data。属主随镜像，权限永远对，不会踩下面的坑
      #   ./data     → 存到仓库目录下，文件在宿主机直接可见，但必须先授权：
      #                mkdir -p data && sudo chown -R 1000:1000 data
      #
      # 坑：docker 自动创建的宿主目录属于 root:root，而容器里跑的是 uid 1000 的 node，
      # 写不进 → 容器反复重启报 SQLITE_CANTOPEN。挂载会覆盖镜像里对 /data 的授权，
      # 所以镜像层面修不了，只能在宿主机侧授权或改用卷。
      - ${DATA_VOLUME:-lw-data}:/data

volumes:
  lw-data:
