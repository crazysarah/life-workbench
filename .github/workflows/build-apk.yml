name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'client/**'
      - 'mobile/**'
      - 'build/**'
      # 改版本号也要触发构建：VERSION 是版本号的唯一来源
      - 'VERSION'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'mobile/**'
      - 'build/**'
      - 'VERSION'
  workflow_dispatch:
    inputs:
      api_base:
        description: '可选的「内置默认地址」（留空也行：APK 首次启动会引导用户自己填，装好后可在 App 内随时改）'
        required: false
        default: ''
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

env:
  # 服务端地址是**可选**的：留空也能出包，APK 首次启动会引导用户自己填，
  # 装好之后还能在 App 里随时改（右下角齿轮）。这里配的只是「内置默认地址」，
  # 用户填过的地址优先级更高。
  # 想内置的话：Settings → Secrets and variables → Actions → Variables → New variable
  #   名称 API_BASE，值形如 http://203.0.113.10:8080 或 https://life.example.com
  DEFAULT_API_BASE: ${{ vars.API_BASE }}

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 这个 action 默认会自己跑 sdkmanager --licenses 接受协议，
          # 但 CI 是非交互环境，它会卡在 "Review licenses that have not been
          # accepted (y/N)?" 拿不到输入然后 exit 1，整条流水线还没开始就挂了。
          # 关掉它，协议交给下一步用 yes 管道接受。
          accept-android-sdk-licenses: false
          packages: ''

      - name: 安装 SDK 组件（Capacitor 7 需要 API 35）
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          echo "sdkmanager 路径：$(command -v sdkmanager || echo '不在 PATH')"
          # 用 yes 管道喂 'y' 接受全部协议，避免非交互环境下卡在提示
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 解析服务端地址
        id: cfg
        run: |
          API_BASE="${{ github.event.inputs.api_base }}"
          if [ -z "$API_BASE" ]; then API_BASE="$DEFAULT_API_BASE"; fi
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then BUILD_TYPE="debug"; fi

          if [ -n "$API_BASE" ]; then
            # 公开仓库的 Actions 日志任何人都能看，把地址打码再打印
            echo "::add-mask::$API_BASE"
            echo "api_base=$API_BASE" >> "$GITHUB_OUTPUT"
            echo "服务端地址：已内置（日志里已打码）"
          else
            echo "api_base=" >> "$GITHUB_OUTPUT"
            echo "服务端地址：未内置 —— APK 首次启动会引导用户自己填，装好后可在 App 内随时改"
          fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "构建类型：$BUILD_TYPE"

          # 版本号唯一来源：仓库根目录 VERSION。注入和校验都以它为准。
          VERSION="$(head -1 VERSION | tr -d ' \t\r\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号：$VERSION"

      - name: 自检（设置逻辑 + 版本号 + 页面静态检查）
        run: |
          node build/test_settings.js
          python3 build/test_version.py
          python3 build/check_client.py client/index.html

      - name: 注入服务端地址
        run: |
          python3 build/inject_api_base.py \
            --api-base "${{ steps.cfg.outputs.api_base }}" \
            --out mobile/www/index.html

      - name: 拷贝静态资源
        run: |
          mkdir -p mobile/www
          cp client/manifest.webmanifest mobile/www/
          cp client/icon.svg mobile/www/
          cp client/icon-maskable.svg mobile/www/

      - name: 安装 Capacitor 依赖
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 生成并同步安卓工程
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # 安卓工程是现场生成的（.gitignore 忽略），签名密钥也得在此时放进去。
      # Secret 存的是 base64 的 PKCS12 私钥。没配置就直接失败 ——
      # 不能让流水线退回「Gradle 现场随机生成密钥」，那种包一个都盖不上旧版本。
      - name: 还原签名密钥
        env:
          LW_DEBUG_KEYSTORE: ${{ secrets.LW_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$LW_DEBUG_KEYSTORE" ]; then
            echo "::error::缺少 Secret「LW_DEBUG_KEYSTORE」：没有固定签名，打出来的包会装不上旧版本。请按 README「固定签名」一节生成密钥并配置 Secret。"
            exit 1
          fi
          echo "$LW_DEBUG_KEYSTORE" | base64 -d > mobile/android/app/lw-debug.p12
          chmod 600 mobile/android/app/lw-debug.p12
          echo "密钥已就位（$(stat -c%s mobile/android/app/lw-debug.p12) 字节）"

      # 先确认「Secret 里的私钥」和「仓库记录的指纹」是同一把 ——
      # 不然要等 Gradle 跑完才在包里发现问题。用的是 openssl，无需额外依赖。
      - name: 核对密钥与仓库记录的指纹
        run: |
          EXPECT="$(grep -v '^#' build/signing-cert.sha256 | head -1 | tr -d ' \r\n')"
          ACTUAL="$(openssl pkcs12 -in mobile/android/app/lw-debug.p12 \
                     -passin pass:android -nokeys -clcerts 2>/dev/null \
                   | openssl x509 -outform der | sha256sum | cut -d' ' -f1)"
          echo "仓库记录：$EXPECT"
          echo "密钥实际：$ACTUAL"
          if [ "$EXPECT" != "$ACTUAL" ]; then
            echo "::error::Secret 里的密钥与 build/signing-cert.sha256 不是同一把 —— 重新生成密钥后忘了同步 Secret？"
            exit 1
          fi

      - name: 打安卓补丁
        run: python3 build/patch_android.py

      # 必须放在 cap add/sync 之后：安卓工程是现场生成的（.gitignore 忽略、不入库），
      # 脚手架版本号永远是 versionCode 1 / versionName "1.0"，
      # 早于这一步做任何版本号改动都会被 cap sync 覆盖掉。
      - name: 注入版本号
        run: python3 build/set_version.py

      - name: 构建 APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.cfg.outputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # 直接读包内二进制 AndroidManifest.xml，不看构建配置 ——
      # 防「配置改对了但没进包」这种静默失败（历史 bug：包里恒为 1.0）
      - name: 校验包内版本号
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "没有产出 APK"; exit 1; fi
          python3 build/check_apk_version.py "$APK"

      # 与版本号同理：签名不对在本地完全看不出来，只有手机上会拒绝安装。
      # 读包内证书指纹，和仓库记录的固定指纹比对。
      - name: 校验包内签名
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "没有产出 APK"; exit 1; fi
          python3 build/check_apk_signer.py "$APK"

      - name: 收集产物
        id: collect
        run: |
          mkdir -p dist
          APK=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "没有产出 APK"; exit 1; fi
          # 产物名带上版本号，下载下来一眼认得出是哪个版本
          OUT="dist/life-workbench-v${{ steps.cfg.outputs.version }}-${{ steps.cfg.outputs.build_type }}.apk"
          cp "$APK" "$OUT"
          ls -lh dist/
          echo "apk_name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          echo "产物：$OUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: life-workbench-v${{ steps.cfg.outputs.version }}-${{ steps.cfg.outputs.build_type }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
