name: Probe A env secret
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A step 级 env 引用 secret
        env:
          LW_DEBUG_KEYSTORE: ${{ secrets.LW_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$LW_DEBUG_KEYSTORE" ]; then
            echo "::error::缺少 Secret「LW_DEBUG_KEYSTORE」：没有固定签名，打出来的包会装不上旧版本。"
            exit 1
          fi
          echo "密钥长度 ${#LW_DEBUG_KEYSTORE}"
