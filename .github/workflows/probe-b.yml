name: Probe B multiline shell
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: B 多行 shell 带续行
        run: |
          EXPECT="$(printf 'abc\n' | head -1 | tr -d ' \r\n')"
          ACTUAL="$(echo hi \
                   | tr a-z A-Z \
                 | cut -d' ' -f1)"
          echo "仓库记录：$EXPECT"
          echo "密钥实际：$ACTUAL"
          if [ "$EXPECT" != "$ACTUAL" ]; then
            echo "::error::对不上"
          fi
